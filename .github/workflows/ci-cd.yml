name: CI/CD - Test, Security Scan and Docker Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Test API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install API dependencies
        run: npm ci

      - name: Run API tests
        run: npm test

  frontend:
    name: Validate React Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Build React frontend
        working-directory: ./frontend
        run: npm run build

  security-sast:
    name: Security - Semgrep SAST
    runs-on: ubuntu-latest
    needs:
      - test
      - frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config /src/.github/security/semgrep.yml \
            /src/src

  docker-security:
    name: Build API and Trivy Security Scan
    runs-on: ubuntu-latest
    needs: security-sast

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build API Docker image for security scan
        run: docker build -t ecommerce-api:security-scan .

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ecommerce-api:security-scan'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM,LOW'
          exit-code: '0'
          ignore-unfixed: false

  docker:
    name: Publish API and Frontend Images
    runs-on: ubuntu-latest
    needs: docker-security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            alexsasec/devops-infra-observability-api:latest
            alexsasec/devops-infra-observability-api:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            alexsasec/devops-infra-observability-frontend:latest
            alexsasec/devops-infra-observability-frontend:${{ github.sha }}